name: StockOS daily financial metrics CI
on:
  push:
    branches: [fix/stockos-daily-dashboard-main-20261029]
  pull_request:
    paths:
      - 'src/main/java/controller/CaixaController.java'
      - 'src/main/resources/static/js/dashboard.js'
      - 'src/main/resources/static/dashboard.html'
      - 'src/test/java/controller/CaixaControllerDailyMetricsTest.java'
      - '.github/workflows/stockos-daily-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/main/resources/static/js/dashboard.js
      - run: mvn -B -Dtest=CaixaControllerDailyMetricsTest test
      - run: npm run test:preview
