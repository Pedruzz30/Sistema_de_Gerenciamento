name: StockOS Backend and Docker

on:
  pull_request:
    branches: [main]
    paths:
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - ".env.example"
      - "scripts/test-docker.ps1"
      - "src/main/**"
      - "src/test/**"
      - ".github/workflows/stockos-backend-docker.yml"
  push:
    branches: [main]
    paths:
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "src/main/**"
      - "src/test/**"
      - ".github/workflows/stockos-backend-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      STOCKOS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5433/stockos_test
      STOCKOS_TEST_DB_USERNAME: stockos_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Start isolated PostgreSQL via Compose
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          export STOCKOS_DB_PASSWORD="$password"
          echo "STOCKOS_TEST_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          docker compose up -d --wait db
      - name: Maven tests on isolated PostgreSQL
        run: mvn -B -ntp test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t stockos:ci .
