name: StockOS tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockos_test
          POSTGRES_PASSWORD: stockos-ci-only
          POSTGRES_DB: sistema_gerenciamento_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U stockos_test -d sistema_gerenciamento_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:55432/sistema_gerenciamento_test
      TEST_DB_USERNAME: stockos_test
      TEST_DB_PASSWORD: stockos-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check database guard
        run: mvn -B -ntp -Dtest=TestDatabaseGuardTest test
      - name: Run all tests
        run: mvn -B -ntp test
