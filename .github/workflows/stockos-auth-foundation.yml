name: StockOS auth foundation checks

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'src/main/resources/db/migration/**'
      - 'src/main/java/**'
      - 'src/main/resources/static/saas-*.html'
      - 'src/main/resources/static/js/saas-*.js'
      - 'src/main/resources/static/css/saas-*.css'
      - 'src/test/java/integration/SaasComandaPostgresIntegrationTest.java'
      - 'src/test/java/integration/Fase46FlywayMigrationIntegrationTest.java'
      - 'src/test/java/app/ProductionSafetyGateTest.java'
      - 'src/test/java/app/StagingSupabaseSettingsTest.java'
      - 'scripts/ci/**'
      - 'tests/browser/**'
      - 'docs/stockos-staging-recovery.md'
      - 'src/test/java/controller/ControllerUtilsJwtTest.java'
      - 'src/test/java/service/SaasTenantAccessTest.java'
      - 'src/test/java/service/SaasLicenseServiceTest.java'
      - 'src/test/java/service/SaasAdminAccessTest.java'
      - '.github/workflows/stockos-auth-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate browser modules syntax
        run: |
          node --check src/main/resources/static/js/saas-comandas.js
          node --check src/main/resources/static/js/saas-admin.js
      - name: Compile and test JWT security foundation
        run: mvn -B -Dtest=ProductionSafetyGateTest,StagingSupabaseSettingsTest,ControllerUtilsJwtTest,SaasTenantAccessTest,SaasLicenseServiceTest,SaasAdminAccessTest test

  postgres-saas-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stockos_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockos_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STOCKOS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/stockos_ci_test
      DB_URL: jdbc:postgresql://127.0.0.1:5432/stockos_ci_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run PostgreSQL Flyway + SaaS transaction integration tests
        run: mvn -B -Dtest=SaasComandaPostgresIntegrationTest test
      - name: Prove full database backup and restore on disposable PostgreSQL
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/verify-stockos-backup-restore.sh

  browser-saas-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser automation dependency
        run: python -m pip install playwright==1.56.0
      - name: Install headless Chromium and runtime libraries
        run: python -m playwright install --with-deps chromium
      - name: Exercise browser flows with fake Auth and API
        run: python -m unittest discover -s tests/browser -p 'test_*.py' -v
