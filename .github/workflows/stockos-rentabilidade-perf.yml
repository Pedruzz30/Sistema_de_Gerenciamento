name: StockOS rentabilidade performance
on:
  push:
    branches: [perf/stockos-rentabilidade-db-aggregation-20261029]
  pull_request:
    paths:
      - 'src/main/java/repository/**'
      - 'src/main/java/service/RentabilidadeService.java'
      - 'src/main/java/service/EstoqueService.java'
      - 'src/test/java/service/RentabilidadeServiceTest.java'
      - '.github/workflows/stockos-rentabilidade-perf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stockos_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stockos_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockos_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/stockos_ci
      DB_USERNAME: postgres
      DB_PASSWORD: stockos_ci_only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -Dtest=RentabilidadeServiceTest,RentabilidadePostgresIntegrationTest test
