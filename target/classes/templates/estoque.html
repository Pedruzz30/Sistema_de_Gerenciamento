<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockOS — Estoque</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/estoque.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📦</div>
      StockOS
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Menu</div>
      <div id="nav-items"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">--</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Carregando...</div>
          <div class="user-role" id="user-role">--</div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Sair">✕</button>
      </div>
    </div>
  </aside>

  <!-- ── Header ── -->
  <header class="header">
    <div>
      <div class="header-title">Estoque</div>
      <div class="header-sub">Gerencie produtos, entradas e saídas</div>
    </div>
    <div class="header-right">
      <button class="btn-primary" onclick="abrirModalCadastro()" id="btn-novo-produto">
        + Novo Produto
      </button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Filtros e busca -->
    <div class="toolbar fade-up">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar produto..." oninput="filtrarProdutos()">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
        <button class="filter-btn" onclick="filtrar('critico', this)">⚠ Crítico</button>
        <button class="filter-btn" onclick="filtrar('baixo', this)">↓ Baixo</button>
        <button class="filter-btn" onclick="filtrar('adequado', this)">✓ Adequado</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="table-card fade-up fade-up-1">
      <div class="table-header">
        <span class="table-title">Produtos em Estoque</span>
        <span class="table-count" id="table-count">—</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Qtd. Atual</th>
              <th>Qtd. Mínima</th>
              <th>Nível</th>
              <th>Preço Unit.</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos">
            <tr><td colspan="6" class="empty">Carregando produtos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ── Modal: Cadastrar Produto ── -->
<div class="modal-overlay" id="modal-cadastro" onclick="fecharModalSeClicouFora(event, 'modal-cadastro')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Novo Produto</h3>
      <button class="modal-close" onclick="fecharModal('modal-cadastro')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nome do produto</label>
        <input type="text" id="c-nome" placeholder="Ex: Laranja">
      </div>
      <div class="form-row-2">
        <div class="form-group">
          <label>Quantidade inicial</label>
          <input type="number" id="c-qtd-inicial" placeholder="0" min="0">
        </div>
        <div class="form-group">
          <label>Quantidade mínima</label>
          <input type="number" id="c-qtd-minima" placeholder="0" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>Preço unitário (R$)</label>
        <input type="number" id="c-preco" placeholder="0,00" step="0.01" min="0">
      </div>
      <div class="alert-modal" id="alert-cadastro"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-cadastro')">Cancelar</button>
      <button class="btn-primary" onclick="cadastrarProduto()">Cadastrar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Movimentação ── -->
<div class="modal-overlay" id="modal-mov" onclick="fecharModalSeClicouFora(event, 'modal-mov')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-mov-titulo">Movimentação</h3>
      <button class="modal-close" onclick="fecharModal('modal-mov')">✕</button>
    </div>
    <div class="modal-body">
      <div class="produto-info-card" id="produto-info-card">
        <div class="produto-info-nome" id="mov-produto-nome">—</div>
        <div class="produto-info-qtd">
          Estoque atual: <strong id="mov-produto-qtd">—</strong>
        </div>
      </div>
      <div class="tipo-toggle">
        <button class="tipo-btn entrada active" id="btn-entrada" onclick="setTipo('ENTRADA')">
          ↑ Entrada
        </button>
        <button class="tipo-btn saida" id="btn-saida" onclick="setTipo('SAIDA')">
          ↓ Saída
        </button>
      </div>
      <div class="form-group">
        <label>Quantidade</label>
        <input type="number" id="mov-qtd" placeholder="0" min="1">
      </div>
      <div class="alert-modal" id="alert-mov"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-mov')">Cancelar</button>
      <button class="btn-primary" id="btn-confirmar-mov" onclick="confirmarMovimentacao()">Confirmar</button>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/estoque.js"></script>
</body>
</html>
