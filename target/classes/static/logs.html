<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockOS — Logs</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/estoque.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📦</div>
      StockOS
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Menu</div>
      <div id="nav-items"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">--</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Carregando...</div>
          <div class="user-role" id="user-role">--</div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Sair">✕</button>
      </div>
    </div>
  </aside>

  <!-- ── Header ── -->
  <header class="header">
    <div>
      <div class="header-title">Logs do Sistema</div>
      <div class="header-sub">Auditoria de ações realizadas no sistema</div>
    </div>
    <div class="header-right">
      <button class="btn-secondary" onclick="carregarLogs()" style="padding:8px 16px;font-size:12.5px">↻ Atualizar</button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Filtro de busca -->
    <div class="toolbar fade-up">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar por ação ou descrição..." oninput="filtrar()">
      </div>
    </div>

    <!-- Tabela de logs -->
    <div class="table-card fade-up fade-up-1">
      <div class="table-header">
        <span class="table-title">Histórico de Ações</span>
        <span class="table-count" id="table-count">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Data / Hora</th>
              <th>Usuário (RU)</th>
              <th>Ação</th>
              <th>Descrição</th>
            </tr>
          </thead>
          <tbody id="tabela-logs">
            <tr><td colspan="5" class="empty">Carregando logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="/js/shared.js"></script>
<script src="/js/logs.js"></script>
</body>
</html>
