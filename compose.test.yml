# PostgreSQL descartavel, exclusivamente para testes StockOS
services:
  stockos-test-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sistema_gerenciamento_test
      POSTGRES_USER: stockos_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Defina TEST_DB_PASSWORD no terminal}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockos_test -d sistema_gerenciamento_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - stockos-test-pgdata:/var/lib/postgresql/data

volumes:
  stockos-test-pgdata:
