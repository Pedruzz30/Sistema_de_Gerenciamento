server.port=8080

# Test-only local overrides (e.g. spring.datasource.password). Deliberately
# a DIFFERENT file from src/main/resources/application-local.properties so
# the test suite never inherits the main app's local configuration by
# accident. Gitignored, optional, lives only on this machine.
spring.config.import=optional:classpath:application-test-local.properties

# The default here is a DEDICATED, disposable test database - never the
# production "sistema_gerenciamento" database. DB_URL can still override it
# (e.g. Fase46FlywayMigrationIntegrationTest points it at throwaway
# per-test databases), but the fallback itself must never be production.
# support.TestDatabaseGuard (registered via META-INF/spring.factories on
# this test classpath) additionally fails the whole context startup - before
# any DataSource/Flyway/Hibernate bean is created - if this ever resolves to
# "sistema_gerenciamento" anyway.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:55432/sistema_gerenciamento_test}
spring.datasource.username=${TEST_DB_USERNAME:stockos_test}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:20260714.03}
spring.flyway.baseline-description=baseline_existing_schema_after_phase4

stockos.schema-compatibility-runner.enabled=${SCHEMA_COMPATIBILITY_RUNNER_ENABLED:false}
stockos.schema-compatibility-runner.fail-on-mismatch=${SCHEMA_COMPATIBILITY_RUNNER_FAIL_ON_MISMATCH:true}
stockos.seed.demo-menu.enabled=true
