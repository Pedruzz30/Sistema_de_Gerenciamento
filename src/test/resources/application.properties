# Isolated automated tests. Never point this configuration at production or Supabase Cloud.
server.port=8080

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${STOCKOS_TEST_DB_URL:jdbc:postgresql://127.0.0.1:5433/stockos_test}
spring.datasource.username=${STOCKOS_TEST_DB_USERNAME:stockos_local}
spring.datasource.password=${STOCKOS_TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:20260714.03}
spring.flyway.baseline-description=baseline_existing_schema_after_phase4

stockos.schema-compatibility-runner.enabled=${SCHEMA_COMPATIBILITY_RUNNER_ENABLED:false}
stockos.schema-compatibility-runner.fail-on-mismatch=${SCHEMA_COMPATIBILITY_RUNNER_FAIL_ON_MISMATCH:true}
stockos.seed.demo-catalog.enabled=true
