server.port=8080

# Optional local-only overrides. Keep machine-specific secrets in
# src/main/resources/application-local.properties or in environment variables.
spring.config.import=optional:classpath:application-local.properties

# Shared datasource defaults. Override with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_gerenciamento}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
