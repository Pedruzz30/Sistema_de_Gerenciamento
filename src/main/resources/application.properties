server.port=8080
# Legacy authentication must never listen on non-loopback interfaces.
server.address=${STOCKOS_SERVER_ADDRESS:127.0.0.1}

# The Supabase issuer is https://<project-ref>.supabase.co/auth/v1
# JWT mode remains staging-only until all multi-tenant access paths are enforced.
stockos.security.mode=${STOCKOS_SECURITY_MODE:legacy-dev}
stockos.security.supabase-issuer=${STOCKOS_SUPABASE_AUTH_ISSUER:}

# Optional local-only overrides. Keep machine-specific secrets in
# src/main/resources/application-local.properties or in environment variables.
spring.config.import=optional:classpath:application-local.properties

# Shared datasource defaults. Override with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_gerenciamento}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is the source of truth for schema changes. Existing development
# databases created by Hibernate are baselined at the last pre-Flyway phase.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:20260714.03}
spring.flyway.baseline-description=baseline_existing_schema_after_phase4

# Temporary schema compatibility validator. It must not create or alter schema.
stockos.schema-compatibility-runner.enabled=${SCHEMA_COMPATIBILITY_RUNNER_ENABLED:false}
stockos.schema-compatibility-runner.fail-on-mismatch=${SCHEMA_COMPATIBILITY_RUNNER_FAIL_ON_MISMATCH:true}

# Demo menu seed is opt-in. Enable only in local/dev/test environments.
stockos.seed.demo-menu.enabled=${STOCKOS_SEED_DEMO_MENU_ENABLED:false}

# Public browser configuration for a dedicated StockOS Supabase project; NOT service_role.
stockos.supabase.url=${STOCKOS_SUPABASE_URL:}
stockos.supabase.publishable-key=${STOCKOS_SUPABASE_PUBLISHABLE_KEY:}

# Optional: pin the expected STAGING Supabase project ref; wrong-project Auth URL fails startup.
stockos.supabase.expected-project-ref=${STOCKOS_SUPABASE_EXPECTED_PROJECT_REF:}

# Internal management console: disabled by default, requires verified JWT and explicit allowlist.
stockos.admin.enabled=${STOCKOS_ADMIN_ENABLED:false}
stockos.admin.auth-user-ids=${STOCKOS_ADMIN_AUTH_USER_IDS:}
