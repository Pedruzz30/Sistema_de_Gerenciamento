<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockOS — Fornecedores</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/estoque.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📦</div>
      StockOS
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Menu</div>
      <div id="nav-items"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">--</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Carregando...</div>
          <div class="user-role" id="user-role">--</div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Sair">✕</button>
      </div>
    </div>
  </aside>

  <!-- ── Header ── -->
  <header class="header">
    <div>
      <div class="header-title">Fornecedores</div>
      <div class="header-sub">Gerencie cadastros e vincule produtos a fornecedores</div>
    </div>
    <div class="header-right">
      <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Fornecedor</button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">

    <div class="page-summary-grid fade-up" id="fornecedor-summary"></div>

    <!-- Filtros -->
    <div class="toolbar fade-up">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar fornecedor..." oninput="filtrar()">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
        <button class="filter-btn" onclick="setFiltro('ativos', this)">Ativos</button>
        <button class="filter-btn" onclick="setFiltro('inativos', this)">Inativos</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="table-card fade-up fade-up-1">
      <div class="table-header">
        <span class="table-title">Fornecedores Cadastrados</span>
        <span class="table-count" id="table-count">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fornecedor</th>
              <th>CNPJ</th>
              <th>Telefone</th>
              <th>Produtos</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-fornecedores">
            <tr><td colspan="6" class="empty">Carregando fornecedores...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ── Modal: Cadastrar Fornecedor ── -->
<div class="modal-overlay" id="modal-cadastro" onclick="fecharModalSeClicouFora(event,'modal-cadastro')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Novo Fornecedor</h3>
      <button class="modal-close" onclick="fecharModal('modal-cadastro')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="c-nome" placeholder="Ex: Hortifrúti São Paulo">
      </div>
      <div class="form-group">
        <label>CNPJ</label>
        <input type="text" id="c-cnpj" placeholder="Ex: 12.345.678/0001-90">
      </div>
      <div class="form-group">
        <label>Telefone (opcional)</label>
        <input type="text" id="c-telefone" placeholder="Ex: (11) 99999-9999">
      </div>
      <div class="alert-modal" id="alert-cadastro"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-cadastro')">Cancelar</button>
      <button class="btn-primary" onclick="cadastrarFornecedor()">Cadastrar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Vincular Produto ── -->
<div class="modal-overlay" id="modal-vincular" onclick="fecharModalSeClicouFora(event,'modal-vincular')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Vincular Produto</h3>
      <button class="modal-close" onclick="fecharModal('modal-vincular')">✕</button>
    </div>
    <div class="modal-body">
      <div class="produto-info-card">
        <div class="produto-info-nome" id="vincular-fornecedor-nome">Fornecedor —</div>
        <div class="produto-info-qtd" id="vincular-produtos-atuais"></div>
      </div>
      <div class="form-group">
        <label>Selecionar Produto</label>
        <select id="vincular-produto-select">
          <option value="">— carregando produtos —</option>
        </select>
      </div>
      <div class="alert-modal" id="alert-vincular"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-vincular')">Cancelar</button>
      <button class="btn-primary" onclick="confirmarVincular()">Vincular</button>
    </div>
  </div>
</div>

<!-- ── Modal: Produtos Vinculados ── -->
<div class="modal-overlay" id="modal-produtos" onclick="fecharModalSeClicouFora(event,'modal-produtos')">
  <div class="modal modal--narrow">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-produtos-titulo">Produtos Vinculados</h3>
      <button class="modal-close" onclick="fecharModal('modal-produtos')">✕</button>
    </div>
    <div class="modal-body">
      <div id="produtos-lista"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-produtos')">Fechar</button>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/fornecedores.js"></script>
</body>
</html>
