<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockOS — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>

<div class="app">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">📦</div>
            StockOS
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-label">Menu</div>
            <div id="nav-items"></div>
        </div>

        <div class="sidebar-bottom">
            <div class="user-card">
                <div class="user-avatar" id="user-avatar">--</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Carregando...</div>
                    <div class="user-role" id="user-role">--</div>
                </div>
                <button class="btn-logout" onclick="logout()" title="Sair">✕</button>
            </div>
        </div>
    </aside>

    <!-- ── Header ── -->
    <header class="header">
        <div>
            <div class="header-title" id="header-title">Carregando...</div>
            <div class="header-sub"  id="header-sub"></div>
        </div>
        <div class="header-right">
            <div class="badge-live">
                <span class="badge-live-dot"></span>
                Sistema online
            </div>
        </div>
    </header>

    <!-- ── Main ── -->
    <main class="main">

        <!-- Cards de resumo -->
        <div class="summary-grid" id="summary-grid"></div>

        <!-- Grid principal -->
        <div class="main-grid">

            <!-- Coluna esquerda -->
            <div style="display:flex; flex-direction:column; gap:16px;">

                <!-- Movimentações recentes -->
                <div class="perm-section card fade-up" id="section-movimentacoes">
                    <div class="card-header">
                        <span class="card-title">Movimentações Recentes</span>
                        <span class="card-badge">Hoje</span>
                    </div>
                    <div class="mov-list" id="mov-list"></div>
                </div>

                <!-- Resumo financeiro -->
                <div class="perm-section card fade-up" id="section-financeiro">
                    <div class="card-header">
                        <span class="card-title">Resumo Financeiro</span>
                        <span class="card-badge">Dia atual</span>
                    </div>
                    <div class="financial-grid">
                        <div class="fin-card">
                            <div class="fin-label">Total Vendas</div>
                            <div class="fin-value green" id="fin-total-vendas">—</div>
                        </div>
                        <div class="fin-card">
                            <div class="fin-label">Caixas Abertos</div>
                            <div class="fin-value purple" id="fin-caixas-abertos">—</div>
                        </div>
                        <div class="fin-card">
                            <div class="fin-label">Ticket Médio</div>
                            <div class="fin-value" id="fin-ticket-medio">—</div>
                        </div>
                    </div>
                    <div class="card-header" style="margin-top:8px;">
                        <span class="card-title" style="font-size:13px; color:var(--text-2);">Status dos Caixas</span>
                    </div>
                    <div class="caixa-list" id="caixa-list"></div>
                </div>

            </div>

            <!-- Coluna direita -->
            <div style="display:flex; flex-direction:column; gap:16px;">

                <!-- Alertas de estoque -->
                <div class="perm-section card fade-up" id="section-alertas">
                    <div class="card-header">
                        <span class="card-title">Alertas de Estoque</span>
                        <span class="card-badge" id="alerta-count">—</span>
                    </div>
                    <div class="alert-list" id="alerta-list"></div>
                </div>

            </div>

        </div>
    </main>

</div>

<script src="/js/dashboard.js"></script>
<script>
    // Atualiza o badge de alertas após renderizar
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const alertas = document.querySelectorAll('.alert-item').length;
        const badge = document.getElementById('alerta-count');
        if (badge) badge.textContent = alertas + ' alertas';
      }, 100);
    });
</script>

</body>
</html>
