<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockOS — Funcionários</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/estoque.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">📦</div>
      StockOS
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Menu</div>
      <div id="nav-items"></div>
    </div>
    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar">--</div>
        <div class="user-info">
          <div class="user-name" id="user-name">Carregando...</div>
          <div class="user-role" id="user-role">--</div>
        </div>
        <button class="btn-logout" onclick="logout()" title="Sair">✕</button>
      </div>
    </div>
  </aside>

  <!-- ── Header ── -->
  <header class="header">
    <div>
      <div class="header-title">Funcionários</div>
      <div class="header-sub">Gerencie cadastros, classes e permissões</div>
    </div>
    <div class="header-right">
      <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Funcionário</button>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Filtros -->
    <div class="toolbar fade-up">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar funcionário..." oninput="filtrar()">
      </div>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
        <button class="filter-btn" onclick="setFiltro('ativos', this)">Ativos</button>
        <button class="filter-btn" onclick="setFiltro('inativos', this)">Inativos</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="table-card fade-up fade-up-1">
      <div class="table-header">
        <span class="table-title">Funcionários Cadastrados</span>
        <span class="table-count" id="table-count">—</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>RU</th>
              <th>Nome</th>
              <th>Classe</th>
              <th>Permissões</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-funcionarios">
            <tr><td colspan="6" class="empty">Carregando funcionários...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ── Modal: Cadastrar Funcionário ── -->
<div class="modal-overlay" id="modal-cadastro" onclick="fecharModalSeClicouFora(event,'modal-cadastro')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Novo Funcionário</h3>
      <button class="modal-close" onclick="fecharModal('modal-cadastro')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row-2">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="c-nome" placeholder="Ex: João">
        </div>
        <div class="form-group">
          <label>Sobrenome</label>
          <input type="text" id="c-sobrenome" placeholder="Ex: Silva">
        </div>
      </div>
      <div class="form-group">
        <label>CPF</label>
        <input type="text" id="c-cpf" placeholder="Ex: 123.456.789-00">
      </div>
      <div class="form-group">
        <label>Senha Inicial</label>
        <input type="password" id="c-senha" placeholder="Senha de acesso">
      </div>
      <div class="form-group">
        <label>Classe</label>
        <select id="c-classe">
          <option value="">— Selecione uma classe —</option>
          <option value="SUPERIOR">Superior — Acesso total</option>
          <option value="GERENTE_ESTOQUE">Gerente de Estoque</option>
          <option value="ESTOQUISTA">Estoquista</option>
          <option value="CAIXA">Caixa</option>
        </select>
      </div>
      <div class="alert-modal" id="alert-cadastro"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-cadastro')">Cancelar</button>
      <button class="btn-primary" onclick="cadastrarFuncionario()">Cadastrar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Mudar Classe ── -->
<div class="modal-overlay" id="modal-classe" onclick="fecharModalSeClicouFora(event,'modal-classe')">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Alterar Classe</h3>
      <button class="modal-close" onclick="fecharModal('modal-classe')">✕</button>
    </div>
    <div class="modal-body">
      <div class="produto-info-card">
        <div class="produto-info-nome" id="classe-func-nome">Funcionário</div>
        <div class="produto-info-qtd" id="classe-atual">Classe atual: —</div>
      </div>
      <div class="form-group">
        <label>Nova Classe</label>
        <select id="nova-classe">
          <option value="">— Selecione —</option>
          <option value="SUPERIOR">Superior — Acesso total</option>
          <option value="GERENTE_ESTOQUE">Gerente de Estoque</option>
          <option value="ESTOQUISTA">Estoquista</option>
          <option value="CAIXA">Caixa</option>
        </select>
      </div>
      <div class="alert-modal" id="alert-classe"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="fecharModal('modal-classe')">Cancelar</button>
      <button class="btn-primary" onclick="confirmarMudarClasse()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/funcionarios.js"></script>
</body>
</html>
