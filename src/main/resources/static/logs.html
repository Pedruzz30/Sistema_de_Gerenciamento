<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockOS — Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">S</div>
      <div class="brand-text">
        <span class="name">StockOS</span>
        <span class="sub">Forno · V2</span>
      </div>
    </div>
    <span class="nav-label">Operação</span>
    <nav class="nav" id="nav-items"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar user-avatar" id="user-avatar">--</div>
        <div class="user-meta user-info">
          <span class="name user-name" id="user-name">Carregando...</span>
          <span class="role user-role" id="user-role">Operador · RU --</span>
        </div>
        <button class="iconbtn btn-logout" onclick="logout()" title="Sair" aria-label="Sair"></button>
      </div>
    </div>
  </aside>

  <div class="main page">
    <header class="topbar header">
      <div class="topbar-left">
        <div class="crumbs">
          <span>StockOS</span>
          <span class="sep">›</span>
          <span class="cur">Logs</span>
        </div>
        <h1 class="page-title header-title" id="header-title">Logs do Sistema</h1>
        <p class="page-sub header-sub" id="header-sub">Auditoria de ações realizadas no sistema.</p>
      </div>
      <div class="topbar-right header-right">
      <button class="btn btn-secondary btn-secondary--compact" onclick="carregarLogs()">
        <span class="btn-inline-icon" data-icon="refresh"></span>
        Atualizar
      </button>
      </div>
    </header>

    <div class="main-body content">

    <div class="page-summary-grid fade-up" id="logs-summary"></div>

    <!-- Filtro de busca -->
    <div class="toolbar fade-up">
      <div class="search-wrap">
        <input class="input input-search" type="text" id="busca" placeholder="Buscar por ação ou descrição..." oninput="filtrar()">
      </div>
    </div>

    <!-- Tabela de logs -->
    <div class="table-card fade-up fade-up-1">
      <div class="table-header">
        <span class="table-title">Histórico de Ações</span>
        <span class="table-count" id="table-count">—</span>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>Data / Hora</th>
              <th>Usuário (RU)</th>
              <th>Ação</th>
              <th>Descrição</th>
            </tr>
          </thead>
          <tbody id="tabela-logs">
            <tr><td colspan="5" class="empty">Carregando logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script src="/js/logs.js"></script>
</body>
</html>
