# StockOS isolated staging on Render. Never use this profile for public mock Netlify.
# Supabase is used solely for signed user identity; business data remains in
# a separate PostgreSQL managed by Render.
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
# Strict separation: migrations run as a one-off administration job.
# The HTTPS application NEVER holds schema-owner/migrator passwords.
spring.flyway.enabled=false
stockos.migrations.mode=external
stockos.auth.mode=supabase
stockos.seed.demo-catalog.enabled=false
# Never configure SPRING_FLYWAY_USER or SPRING_FLYWAY_PASSWORD in the web service.
# Provision schema separately before starting the runtime-only app.
