# Existing SaaS schema was applied with Supabase-managed migrations.
# CRITICAL: staging is a private schema without legacy tables. Flyway's normal
# migration location also contains public legacy DDL and an incompatible
# history. Do NOT let Spring run Flyway automatically against this database.
spring.flyway.enabled=false

# Fail closed until legacy JPA entities have been separated from SaaS staging.
# DO NOT replace with update/create or none merely to force boot.
spring.jpa.hibernate.ddl-auto=validate

# Staging must never seed legacy demo users or product menus.
stockos.seed.demo-menu.enabled=false
