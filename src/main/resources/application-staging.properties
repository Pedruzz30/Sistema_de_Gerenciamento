# StockOS isolated staging on Render. Never use this profile for public mock Netlify.
# Supabase is used solely for signed user identity; business data remains in
# a separate PostgreSQL managed by Render.
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
stockos.auth.mode=supabase
stockos.seed.demo-catalog.enabled=false
# The Supabase-mode Flyway strategy requires distinct SPRING_FLYWAY_USER and
# SPRING_FLYWAY_PASSWORD. Never give DB_USERNAME superuser or owner privileges.
